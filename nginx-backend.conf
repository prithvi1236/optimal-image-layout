# Nginx config for proxying to Flask backend (Smart Layout Studio)
# Use this when frontend runs elsewhere (e.g. localhost:5173 in dev, or a separate static host).
#
# IMPORTANT: Remove "try_files" from the location / block.
# try_files $uri $uri/ =404 runs BEFORE proxy_pass: for /extract_img, /ping, etc.
# nginx looks for a file, doesn't find it, and returns 404. The request never
# reaches Flask, so you get "Preflight response is not successful. Status code: 404".
#
# Place in /etc/nginx/sites-available/ (or sites-enabled) and symlink as needed.
# Reload: sudo nginx -t && sudo systemctl reload nginx

upstream flasklayout {
    server 127.0.0.1:8000;   # or your Flask/Gunicorn port
}

server {
    listen 80;
    server_name _;   # or your domain, e.g. api.example.com

    # Allow uploads up to 50MB (must be >= Flask MAX_FILE_SIZE in config.py).
    # Nginx default is 1MB; without this, nginx returns 413 before Flask sees the request,
    # and that 413 has no CORS headers → browser shows "Origin is not allowed" instead of 413.
    client_max_body_size 50m;

    location / {
        proxy_pass http://flasklayout;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Do NOT add CORS headers here. Flask (flask-cors) already adds them.
        # If both nginx and Flask set Access-Control-Allow-Origin, the response has
        # the header twice → "Access-Control-Allow-Origin cannot contain more than one origin".
        # Do NOT use try_files here – it returns 404 for /ping, /extract_img, etc. before proxying.
    }
}
